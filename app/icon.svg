<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Antenna ball -->
  <circle cx="16" cy="2.5" r="2.5" fill="#FFE94A"/>
  <!-- Antenna stem -->
  <rect x="15" y="4" width="2" height="4" rx="1" fill="#374151"/>
  <!-- Head -->
  <rect x="3" y="7" width="26" height="22" rx="5" fill="#1E63FF"/>
  <!-- Corner bolts -->
  <circle cx="7"  cy="11" r="1.5" fill="#0A3FBA"/>
  <circle cx="25" cy="11" r="1.5" fill="#0A3FBA"/>
  <circle cx="7"  cy="25" r="1.5" fill="#0A3FBA"/>
  <circle cx="25" cy="25" r="1.5" fill="#0A3FBA"/>
  <!-- Eyes -->
  <circle cx="12" cy="17" r="4"   fill="white"/>
  <circle cx="20" cy="17" r="4"   fill="white"/>
  <!-- Pupils -->
  <circle cx="13" cy="16" r="2"   fill="#0A3FBA"/>
  <circle cx="21" cy="16" r="2"   fill="#0A3FBA"/>
  <!-- Smile -->
  <path d="M 9 23 Q 16 29 23 23" stroke="#FFE94A" stroke-width="2" stroke-linecap="round" fill="none"/>
